# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/cla.rs
name: CLA
'on':
  issue_comment:
    types:
    - created
  pull_request_target:
    types:
    - opened
    - reopened
    - synchronize
    branches:
    - main
jobs:
  cla:
    if: (github.event.issue.pull_request && (github.event.comment.body == 'recheck' || contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA'))) || github.event_name == 'pull_request_target'
    name: CLA Assistant
    runs-on: namespace-profile-linux-tiny-no-cache
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    steps:
    - name: Check CLA signature
      uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
      with:
        path-to-signatures: signatures/v1/cla.json
        path-to-document: https://github.com/macro-inc/macro/blob/main/CLA.md
        branch: cla-signatures
        allowlist: '*[bot]'
        custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
        lock-pullrequest-aftermerge: 'false'
        custom-notsigned-prcomment: |
          Thanks for the pull request! Before we can merge it, we need you to sign
          our [Contributor License Agreement](https://github.com/macro-inc/macro/blob/main/CLA.md).

          Macro is dual licensed: everyone gets it under the AGPLv3, and companies
          that cannot work within the AGPLv3's terms can buy a commercial license.
          The CLA is what lets us include your contribution in both. **You keep the
          copyright in your work** and can reuse it anywhere — it is a license
          grant, not an assignment. What we commit to in return is written down in
          [LICENSING.md](https://github.com/macro-inc/macro/blob/main/LICENSING.md#what-we-commit-to).

          If your employer owns what you write, or you are contributing on a
          company's behalf, email legal@macro.com for the
          [Entity CLA](https://github.com/macro-inc/macro/blob/main/CLA-ENTITY.md)
          instead of signing below.

          To sign, post a comment on this pull request with exactly:
        custom-allsigned-prcomment: All contributors have signed the CLA. Thanks — on to the review.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
