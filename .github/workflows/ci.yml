# Deprecated: required checks moved to Buildkite (CROS-63).
# Kept for manual workflow_dispatch only — do not re-enable push/PR triggers.
name: Crost CI (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add swap (link needs headroom on ubuntu-latest)
        run: |
          set -euo pipefail
          if swapon --show=NAME 2>/dev/null | grep -qx '/swapfile'; then
            echo "swap already active at /swapfile"
          elif [[ -f /swapfile ]]; then
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          else
            sudo fallocate -l 8G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Setup Nix dev shell
        uses: ./.github/actions/setup-nix-dev-shell

      - name: Check Rust workspace (offline sqlx)
        run: SQLX_OFFLINE=true cargo check --workspace --bins -j 2
        env:
          NIX_REMOTE: daemon

  web:
    name: SolidJS app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nix
        uses: ./.github/actions/setup-nix

      - name: Setup web prerequisites
        uses: ./.github/actions/setup-reqs-web

      - name: Build frontend (production)
        run: just build-dev
        working-directory: apps/web
