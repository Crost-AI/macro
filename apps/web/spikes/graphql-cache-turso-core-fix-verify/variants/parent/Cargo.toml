[package]
name = "turso-temp-fix-parent"
version = "0.0.0"
edition = "2021"
rust-version = "1.94"
publish = false

[workspace]

[lib]
path = "../../harness/src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[example]]
name = "native"
path = "../../harness/examples/native.rs"

[features]
default = ["cross-target-minimum", "parent-revision"]
wasm-minimum = ["turso_core/fs", "turso_core/uuid"]
cross-target-minimum = ["wasm-minimum", "turso_core/pure-rust-crypto"]
failing-runtime-probes = []
parent-revision = []
head-revision = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
turso_core = { path = "../../target/sources/parent/core", default-features = false }
wasm-bindgen = "=0.2.121"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
