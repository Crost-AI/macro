[package]
name = "turso-core-wasm-spike"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["cross-target-minimum"]
wasm-minimum = ["turso_core/fs", "turso_core/uuid"]
cross-target-minimum = ["wasm-minimum", "turso_core/pure-rust-crypto"]
probe-no-uuid = ["turso_core/fs"]
failing-runtime-probes = []

[dependencies]
turso_core = { git = "https://github.com/tursodatabase/turso.git", rev = "ed15b13f8e5f77d7ae24af321a63d7cd0fa53365", default-features = false }
wasm-bindgen = "=0.2.121"
