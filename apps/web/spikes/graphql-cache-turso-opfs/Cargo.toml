[workspace]
members = ["tools/inspect-wasm"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.94"
license = "UNLICENSED"

[package]
name = "turso-opfs-spike"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["native-test"]
wasm-minimum = ["turso_core/fs", "turso_core/uuid"]
native-test = ["wasm-minimum", "turso_core/pure-rust-crypto"]
failing-runtime-probes = []

[dependencies]
js-sys = "=0.3.98"
turso_core = { git = "https://github.com/tursodatabase/turso.git", rev = "ed15b13f8e5f77d7ae24af321a63d7cd0fa53365", default-features = false }
wasm-bindgen = "=0.2.121"
wasm-bindgen-futures = "=0.4.71"

[dependencies.web-sys]
version = "=0.3.98"
features = [
  "DedicatedWorkerGlobalScope",
  "DomException",
  "File",
  "FileSystemDirectoryHandle",
  "FileSystemFileHandle",
  "FileSystemGetDirectoryOptions",
  "FileSystemGetFileOptions",
  "FileSystemReadWriteOptions",
  "FileSystemSyncAccessHandle",
  "StorageManager",
  "WorkerGlobalScope",
  "WorkerNavigator",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
