<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WP-03 Turso cache coordinator spike</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { max-width: 72rem; margin: 2rem auto; padding: 0 1rem; }
      button { padding: 0.6rem 1rem; }
      pre { padding: 1rem; border: 1px solid #8888; border-radius: 0.5rem; overflow: auto; }
      #result[data-status="passed"] { border-color: #2a5; }
      #result[data-status="failed"] { border-color: #d44; }
    </style>
  </head>
  <body>
    <h1>WP-03 coordinator topology spike</h1>
    <p>
      Opens three real same-origin tabs, elects one lazy dedicated worker, and
      exercises graceful and abrupt owner handoffs through a SharedWorker.
    </p>
    <button id="run" type="button">Run three-tab scenario</button>
    <h2>Result</h2>
    <pre id="result" data-status="idle">idle</pre>
    <h2>Event log</h2>
    <pre id="log"></pre>
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
