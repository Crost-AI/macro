[package]
name = "sync_service"
version = "0.1.0"
edition = "2024"
authors = ["synoet <teonys@nyu.edu>"]
build = "build.rs"

[features]
default = ["bebop-owned-all", "do-sqlite-snapshot-storage", "search-service"]
no-network-deps = []
do-sqlite-snapshot-storage = []
kv-snapshot-storage = []
r2-snapshot-storage = []
search-service = []
bebop-owned-all = ["sync_service_bebop_schema/bebop-owned-all"]
create-default-state = []
alarm-keep-alive = []
# Enables the utoipa OpenAPI spec + the `sync_service_openapi` generator bin. Kept out of the wasm build.
openapi = ["dep:utoipa"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "sync_service_openapi"
path = "src/bins/openapi.rs"
required-features = ["openapi"]

[package.metadata.release]
release = false

[profile.release]
# enable link time optimization
lto = true
# optimize for size
opt-level = 's'
# even smaller but remove's vectorization, and is slower
#opt-level = 'z'

[package.metadata.wasm-pack.profile.release]
# https://github.com/rustwasm/wasm-pack/issues/1247
wasm-opt = true

[dependencies]
worker = { version = "0.8.1", features = ['d1', 'http', 'axum'] }
axum = { version = "0.8", default-features = false, features = ['json', 'query'] }
tower-service = "0.3"
tower-http = { version = "0.6", default-features = false, features = ["cors"] }
enum-map = "2"
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = [
  'time',
  'json',
  'env-filter',
] }
tracing-web = "0.1"
web-time =  "1.1.0"
time = { version = "0.3", features = ['wasm-bindgen'] }
bebop =  "3.1.3"
sync_service_bebop_schema = { path = "bebop-schema" }
serde_json = "1.0.140"
serde = { version = "1.0.219", features = ["derive"] }
derive_more = { version = "2", features = ["display", "as_ref", "from"] }
wasm-bindgen = "0.2.100"
uuid = { version = "1.16.0", features = ["v4", "js"] }
loro = "1.13"
jsonwebtoken = { git = "https://github.com/whutchinson98/jsonwebtoken", features = ["rust_crypto"] }
utoipa = { version = "5.4.0", optional = true }
thiserror = "2"
